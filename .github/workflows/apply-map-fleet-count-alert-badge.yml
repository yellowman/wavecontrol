name: Apply map, fleet-count, and alert-badge fixes

on:
  push:
    branches:
      - fix/map-fleet-count-alert-badge

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested fixes
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_name}: expected one match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          replace_once(
              "cmd/server/main.go",
              '''\timgSrc := []string{"'self'", "data:", "https://*.tile.openstreetmap.org", "https://*.basemaps.cartocdn.com", "https://unpkg.com"}''',
              '''\timgSrc := []string{"'self'", "data:", "https://tile.openstreetmap.org", "https://unpkg.com"}''',
          )

          replace_once(
              "web/js/app.js",
              "import { store } from './store.js?v=15'",
              "import { store } from './store.js?v=16'",
          )
          replace_once(
              "web/js/app.js",
              "         addJobEvent, startTrackedJob, trackJob, getActiveJobCount, cleanupVirtualTable } from './components.js?v=65'",
              "         addJobEvent, startTrackedJob, trackJob, getActiveJobCount, cleanupVirtualTable } from './components.js?v=66'",
          )
          replace_once(
              "web/js/app.js",
              "} from './virtual-integration.js?v=11'",
              "} from './virtual-integration.js?v=12'",
          )
          replace_once(
              "web/js/app.js",
              '''    // Dark tile layer
              L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap, &copy; CARTO',
                maxZoom: 19
              }).addTo(mapInstance)''',
              '''    // Use Leaflet's standard OpenStreetMap raster endpoint. Keep the tile
              // layer separate so dark-theme styling never alters markers or AP-to-STA links.
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                className: 'wavecontrol-map-tiles',
                maxZoom: 19
              }).addTo(mapInstance)''',
          )

          replace_once(
              "web/js/components.js",
              "import { store } from './store.js?v=15'\nimport { api } from './api.js?v=27'",
              "import { store } from './store.js?v=16'\nimport { api } from './api.js?v=28'",
          )
          replace_once(
              "web/js/components.js",
              "} from './virtual-integration.js?v=11'",
              "} from './virtual-integration.js?v=12'",
          )
          replace_once(
              "web/js/virtual-integration.js",
              "import { store } from './store.js?v=15'",
              "import { store } from './store.js?v=16'",
          )

          replace_once(
              "web/js/store.js",
              '''  // Helper: Count devices by status
              get counts() {
                const counts = { online: 0, offline: 0, unknown: 0 }
                const devices = getDashboardScopedDevices(state.devices)
                devices.forEach(d => {''',
              '''  // Header fleet totals are global and must not change when the Dashboard's
              // optional type/band exclusions are active. Those exclusions affect only
              // Dashboard rendering; every page reports the same complete-inventory totals.
              get counts() {
                const counts = { online: 0, offline: 0, unknown: 0 }
                const devices = Array.isArray(state.devices) ? state.devices : []
                devices.forEach(d => {''',
          )

          replace_once(
              "web/css/styles.css",
              '''.header-tabs a {
                color: var(--text-2);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                border-bottom: 2px solid transparent;
                transition: all 0.2s;
              }''',
              '''.header-tabs a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.35rem;
                flex: 0 0 auto;
                white-space: nowrap;
                color: var(--text-2);
                text-decoration: none;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
                font-weight: 600;
                line-height: 1;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                border-bottom: 2px solid transparent;
                transition: all 0.2s;
              }''',
          )
          replace_once(
              "web/css/styles.css",
              '''.map-container {
                flex: 1;
                min-height: 600px;
                height: 600px;
              }

              .map-marker {''',
              '''.map-container {
                flex: 1;
                min-height: 600px;
                height: 600px;
              }

              /* The standard OSM raster layer is light. Darken only its tiles in dark
                 mode; markers, popups, and AP-to-STA link overlays remain untouched. */
              html[data-theme="dark"] .wavecontrol-map-tiles {
                filter: invert(100%) hue-rotate(180deg) brightness(78%) contrast(90%) saturate(70%);
              }

              html[data-theme="dark"] #mapContainer .leaflet-control-attribution {
                background: rgba(8, 31, 49, 0.9);
                color: var(--text-2);
              }

              html[data-theme="dark"] #mapContainer .leaflet-control-attribution a {
                color: var(--cyan);
              }

              .map-marker {''',
          )
          replace_once(
              "web/css/styles.css",
              '''.nav-alert-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 16px;
                height: 16px;
                padding: 0 5px;
                margin-left: 4px;
                border-radius: 999px;
                background: var(--red);
                color: white;
                font-size: 10px;
                line-height: 1;
                vertical-align: middle;
              }''',
              '''.nav-alert-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 auto;
                min-width: 16px;
                height: 16px;
                padding: 0 5px;
                margin: 0;
                border-radius: 999px;
                background: var(--red);
                color: white;
                font-size: 10px;
                line-height: 1;
              }''',
          )

          replace_once(
              "web/index.html",
              '  <link rel="stylesheet" href="css/styles.css?v=59"/>',
              '  <link rel="stylesheet" href="css/styles.css?v=60"/>',
          )
          replace_once(
              "web/index.html",
              '  <script type="module" src="js/app.js?v=121"></script>',
              '  <script type="module" src="js/app.js?v=122"></script>',
          )

          replace_once(
              "SPEC.md",
              "- `img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com` + extra",
              "- `img-src 'self' data: https://tile.openstreetmap.org` + extra",
          )
          replace_once(
              "SPEC.md",
              "Uses Leaflet with CARTO dark tiles. Features:",
              "Uses Leaflet with the standard OpenStreetMap raster endpoint. In dark mode, WaveControl filters only the basemap tile layer. Features:",
          )
          PY

          gofmt -w cmd/server/main.go
          git diff --check

          node --check web/js/app.js
          node --check web/js/components.js
          node --check web/js/store.js
          node --check web/js/virtual-integration.js

          python3 - <<'PY'
          from pathlib import Path

          app = Path('web/js/app.js').read_text()
          store = Path('web/js/store.js').read_text()
          css = Path('web/css/styles.css').read_text()
          csp = Path('cmd/server/main.go').read_text()

          assert 'basemaps.cartocdn.com' not in app
          assert 'https://tile.openstreetmap.org/{z}/{x}/{y}.png' in app
          assert "className: 'wavecontrol-map-tiles'" in app
          assert 'https://*.basemaps.cartocdn.com' not in csp
          assert 'https://tile.openstreetmap.org' in csp

          counts_start = store.index('get counts() {')
          counts_end = store.index('// Toggle tree node expansion', counts_start)
          counts = store[counts_start:counts_end]
          assert 'Array.isArray(state.devices) ? state.devices : []' in counts
          assert 'getDashboardScopedDevices(state.devices)' not in counts

          header_start = css.index('.header-tabs a {')
          header_end = css.index('.header-tabs a:hover', header_start)
          header_rule = css[header_start:header_end]
          for expected in ('display: inline-flex', 'flex: 0 0 auto', 'white-space: nowrap', 'align-items: center'):
              assert expected in header_rule

          badge_start = css.index('.nav-alert-badge {')
          badge_end = css.index('.alerts-page', badge_start)
          badge_rule = css[badge_start:badge_end]
          assert 'flex: 0 0 auto' in badge_rule
          assert 'margin: 0' in badge_rule
          assert 'vertical-align:' not in badge_rule
          PY

          go test ./...
          go vet ./...

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-map-fleet-count-alert-badge.yml
          git add -A
          git commit -m "Fix map tiles, fleet counts, and alert badge layout"
          git push origin "HEAD:${GITHUB_REF_NAME}"
